name = "stewardhouse-pilot"
compatibility_date = "2025-09-01"

# D1 binding — `env.DB` inside CF Pages Functions (no functions exist yet;
# this slice is schema-only).
#
# database_id below is a deliberate placeholder. The real id is returned by
# `wrangler d1 create stewardhouse-pilot` — an FT-run cloud step NOT
# performed in this slice. Local `wrangler d1 ... --local` commands operate
# on the SQLite mirror under .wrangler/state/ and do not use this id.
[[d1_databases]]
binding = "DB"
database_name = "stewardhouse-pilot"
database_id = "PLACEHOLDER_LOCAL_ONLY_replace_after_d1_create"
migrations_dir = "migrations"
