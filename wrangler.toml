name = "stewardhouse-pilot"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]   # required by better-auth runtime

pages_build_output_dir = "dist"            # Vite SPA build target; Pages Functions auto-bundle from ./functions

# D1 binding — surfaces inside CF Pages Functions as `context.env.DB`.
# Live database `stewardhouse-pilot` on Cloudflare (region ENAM); the id
# was returned by `wrangler d1 create stewardhouse-pilot` (FT-run cloud
# step). `--local` commands operate on the SQLite mirror under
# `.wrangler/state/` and do not need the live id.
[[d1_databases]]
binding = "DB"
database_name = "stewardhouse-pilot"
database_id = "8600684c-25dd-4cfe-a41d-f3f6e53779c7"
migrations_dir = "migrations"
